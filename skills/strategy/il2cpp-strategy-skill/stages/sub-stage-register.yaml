  - crackings/<type>/<Name>/stages/04-sdk-network-device-verify/screenshot-normal.png
  - crackings/<type>/<Name>/stages/04-sdk-network-device-verify/screenshot-airplane.png
  notes:
  - '原 05 + 原 07 合并；il2cpp 复用 common 版验收脚本'
  - 成功 → 强制固化
