- id: '05'
  name: revenue-forwarding
  actions:
  - default-action
  name_zh: 激励视频转发
  function: 激励视频转发（5 步：信息收集 → 策略选择 → hook 注册 → 调用链检查 → yaml 报告）
  role: revenue-detection.yaml 存在 + Hooked_* ≥1 + callJava("showRewardVideo") ≥1
    + A64HookFunction 注册 + 调用链完整
  mode: automatic
  verify: false
  script: 
    skills/strategy/il2cpp-strategy-skill/scripts/workflow/sub-stage-reward-video-forwarding.py
  outputs:
  - crackings/<type>/<Name>/stages/05-revenue-forwarding/revenue-detection.yaml
  - crackings/<type>/<Name>/stages/05-revenue-forwarding/revenue-report.yaml
  - crackings/<type>/<Name>/project/app/app/src/main/cpp/native-lib.cpp
  - crackings/<type>/<Name>/project/app/app/src/main/java/com/android/boot/MainActivity.java
  notes:
  - 步骤1（信息收集）：从 step1-signatures/（dump.cs / il2cpp.h / script.json）中收集激励视频方法
  - 步骤2（策略选择）：il2cpp → native_hook：注入 Hooked_* + callJava("showRewardVideo")
  - 步骤3（hook 注册）：il2cpp → 使用 A64HookFunction（And64InlineHook），注册到 "Hook Engine 
    Initialized" 前
  - 步骤4（调用链检查）：MainActivity → SDKUtils.showRewardVideo()，函数是否默认返回 true
  - 步骤5（报告生成）：生成 revenue-report.yaml（yaml 格式）
  - RVA 来源：hook-plan.yaml（category=Ad），无则使用 DEFAULT_HOOKS
  - 成功 → 强制固化
  - '原 actions 合并为 default-action(多 action 表: detect, forward, build, report)'
