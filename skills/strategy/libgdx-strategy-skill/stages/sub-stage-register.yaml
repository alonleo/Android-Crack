major_stages:
- id: M1
  name: sniff
  name_zh: 类型嗅探
  function: 类型嗅探（unzip -l + sniff_patterns 匹配）
  role: findings.md 含类型段
  mode: automatic
  verify: false
  script: skills/common/general-strategy-skill/scripts/workflow/sub-stage-sniff.py
  outputs:
  - crackings/<type>/<Name>/findings.md
  notes:
  - 子阶段 01-xapk-merge（sub-stage-xapk-merge.py）是嗅探阶段的 helper：XAPK → fat APK 合并
- id: M2
  name: assess
  name_zh: 难度评估
  function: 难度评估（6 维加权 → grade S/A/B/C/D/F）
  role: difficulty.json grade 字段非空
  mode: automatic
  verify: false
  script: skills/common/general-strategy-skill/scripts/workflow/sub-stage-assess.py
  outputs:
  - crackings/<type>/<Name>/difficulty.json
  - crackings/<type>/<Name>/raw/assessment.md
- id: M3
  name: final-check
  name_zh: 最终验收
  function: 最终验收（6 条硬指标全过）
  role: OBJECTIVES.md §1 六条硬指标全过：编译/运行/汉化/SDK 移除/重签名 v1+v2+v3/网络检测移除
  mode: automatic
  verify: false
  script: 
    skills/common/general-strategy-skill/scripts/workflow/sub-stage-final-check.py
  outputs:
  - crackings/<type>/<Name>/stages/23-final-check/final-report.md
- id: M4
  name: cleanup
  name_zh: 清理临时空间
  function: 清理临时空间（仅保留最终产物）
  role: 中间产物已删除，最终保留 crackings/<type>/<Name>/project/{app/, patched.apk, 
    my.keystore.jks → symlink, gradle/, *.gradle*, settings.gradle*}
  mode: automatic
