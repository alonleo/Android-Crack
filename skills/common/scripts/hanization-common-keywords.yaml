# hanization-common-keywords.yaml — 常见游戏内容关键字 → 中文 汉化字典（跨 type 共享）
#
# 用途：由 generate-hanization-translations.py 在「文本汉化」子阶段加载，对
#       global-metadata.dat 的 stringliteral.json 做匹配，生成 translations.json，
#       再经 metadata-patcher 写回完成汉化。
#
# 匹配规则：
#   - match: exact     —— value 与 stringliteral 串做「大小写不敏感精确匹配」。
#                         用于整串就是该 UI 文案的情况（最安全，默认）。
#   - match: contains  —— value 作为「大小写不敏感子串」出现在 stringliteral 串中即命中。
#                         用于"带占位符/前后缀"的文案，务必用足够独特的串避免误翻样板。
#
# 占位符纪律：%s / %d / {0} / <color> 等必须原样保留在 zh 译文中（metadata-patcher 
#             重建时按 index 写回，格式化串被破坏会运行期异常）。
#
# 维护：只追加不删改；新套路提取为关键词条目。
#
# 该字典是「常见游戏内容关键字」的共享集，可在此基础上按项目类型补充
# 类型专用关键字到对应 type skill（objects 段）。

