sniff_routing:
  order:
  - air
  - il2cpp
  - unreal
  - unity-mono
  - xamarin
  - flutter
  - cocos-creator
  - cocos2dx
  - libgdx
  - defold
  - gamemaker
  - android
  patterns:
    air:
    - META-INF/AIR/application.xml
    - assets/META-INF/AIR/application.xml
    il2cpp:
    - lib/.*/libil2cpp\.so
    unity-mono:
    - lib/.*/GameAssembly\.dll
    cocos2dx:
    - libcocos2d.*\.so
    - libMyGame\.so
    - libgame\.so
    cocos-creator:
    - libcocos2djs\.so
    - src/settings\.js
    - assets/main/config\.json
    libgdx:
    - lib/.*/libgdx\.so
    - com/badlogic/gdx/
    defold:
    - assets/game\.dmanifest
    - assets/game\.projectc
    - assets/game\.arcd
    gamemaker:
    - assets/game\.droid
    - lib/.*/libyoyo\.so
    android:
    - classes[0-9]*\.dex
    flutter:
    - libflutter\.so
    - libapp\.so
    unreal:
    - libUE4\.so
    - libUnreal.*\.so
    - libUnrealEngine.*\.so
    xamarin:
    - libmonodroid\.so
    - libmono-native\.so
    - libxamarin-app\.so
