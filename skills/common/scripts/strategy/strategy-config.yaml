        report:
          func: skills/common/general-strategy-skill/scripts/common/handlers/ui_hide/report.py:CommonUiHideReportHandler
    '08':
      id: '08'
      name: ui-hide-device-verify
      name_zh: 真机验收（去功能点）
      function: 真机验收（去功能点）
      role: 目标按钮不可见/不可点击 + 布局未变形 + 核心玩法仍可进入（成功→强制固化）
