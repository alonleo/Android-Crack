      - crackings/<type>/<Name>/project/app/app/src/main/java/com/android/boot/{MainActivity.java,JniBridge.java,App.java}
      - crackings/<type>/<Name>/project/my.keystore.jks
      - crackings/<type>/<Name>/stages/02-preprocess-build/build-report.md
      notes:
      - 7 步统一流程：apktool 解包（含自动修复 split 配置：移除 android:requiredSplitTypes / com.android.vending.splits.required）→
        整理 AS 项目（保留原 smali）→ 注入模板文件（MainActivity/JniBridge/App + manifest 入口替换）→ 工具链规范（AGP
        7.4.2 / Gradle 7.5.1 / JDK 11 / compileSdk 33）→ ProGuard keep → 生成签名（my.keystore.jks
        + signingConfigs）→ 编译测试
      - 重打包签名 + AS 工程化已并入本阶段，不再作为独立子阶段
      - 原 smali 保留在 app/src/main/smali/，不转 dex
    '03':
      id: '03'
      name: sdk-network-removal
      name_zh: 去SDK + 去网络检测（合并）
      function: 去第三方SDK + 去网络检测（5 步：信息收集 → 统一清理 → 统一桩化 → 一次构建 → 统一报告）
      role: 3rd-party-sdk.yaml 存在 + Manifest SDK 关键字=0 + .so 引擎保留 + smali 已转 jar +
        gradlew 0
      mode: automatic
      verify: false
      script: skills/common/general-strategy-skill/scripts/workflow/sub-stage-sdk-network-removal.py
      outputs:
      - crackings/<type>/<Name>/stages/03-sdk-network-removal/3rd-party-sdk.yaml
      - crackings/<type>/<Name>/stages/03-sdk-network-removal/sdk-removal-report.yaml
      - crackings/<type>/<Name>/stages/03-sdk-network-removal/third-party-libs/
      notes:
      - '原 04 (3rd-party-sdk-removal) + 原 06 (network-detection-removal)
        合并为新 04 (sdk-network-removal)'
      - 步骤1（收集 SDK 信息）：扫描 manifest + lib/*.so + smali + step1-signatures/，生成 3rd-party-sdk.yaml
      - 步骤2（清理 manifest）：按 3rd-party-sdk.yaml 移除权限/组件
      - 步骤3（清理 .so）：按 3rd-party-sdk.yaml 删除第三方 SDK 的 .so，保留引擎 .so
      - 步骤4（清理 smali）：按 3rd-party-sdk.yaml 删除 smali，但保留 jar 转换所需类
      - 步骤5（hook/桩化）：对无法删除的 SDK 初始化/回调函数做桩化
      - 步骤6（关键字验证）：grep 检查 manifest/smali 中无 SDK 残留关键字
      - 步骤7（生成报告）：sdk-removal-report.yaml，记录清理结果
      - 步骤8（smali→jar）：将保留的 smali 转 jar，放入 `app/javaScaffoding/` 中，并在 build.gradle
        导入
      - 步骤9（gradlew 构建）：./gradlew assembleRelease，验证重打包成功
      - 成功 → 强制固化
      - type-specific 工具：sub-stage-remove-sdks / sub-stage-defold-manifest-clean 等
      handlers:
        collect:
          func: skills/common/general-strategy-skill/scripts/common/handlers/sdk_network/collect.py:CommonSdkNetworkCollectHandler
        clean:
          func: skills/common/general-strategy-skill/scripts/common/handlers/sdk_network/clean.py:CommonSdkNetworkCleanHandler
