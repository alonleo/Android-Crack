      role: AndroidManifest.xml + apktool.yml + smali/ 存在 + source.apk.md5 非空 + gradlew
        assembleRelease 0 + apksigner v1+v2+v3 + JDK 11 / AGP 7.4.2 / Gradle 7.5.1
