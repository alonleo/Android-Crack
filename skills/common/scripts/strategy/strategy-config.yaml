      build: ILSpy 重编译 .NET DLL + 重打包
    cocos2dx:
      static_primary: cocos2d-console + readelf + objdump
      static_backup: IDA / Ghidra
      dynamic: Frida + And64InlineHook
      build: apktool 重打包 + native hook 集成
    cocos-creator:
      static_primary: cc-reverse（JSC 解密 + 项目重建）
      static_backup: reverse（XXTEA 密钥提取）+ cocos2d-dec（批处理解密）
      dynamic: Frida + frida-cocosjs（运行时密钥） + And64InlineHook
      build: apktool 重打包 + JS patch
    libgdx:
      static_primary: jadx（com.badlogic.gdx + 业务类引用）+ apktool
      static_backup: ''
      dynamic: adb + logcat（libGDX 内置 GLSurfaceView） + Frida（如需 Java 层 hook） + And64InlineHook
      build: apktool 重打包 + smali patch（资源 / manifest / .so 清理）
    defold:
      static_primary: jadx + strings/readelf（引擎判定）+ apktool
      static_backup: ''
      dynamic: adb + logcat（bklang tag） + And64InlineHook
      build: apktool 重打包 + smali patch（禁止物理删 SDK smali，JNI 依赖）
    gamemaker:
      static_primary: jadx + strings/readelf（YYObjectBase/RValue 引擎判定）+ apktool
      static_backup: UndertaleModTool（.droid 资产浏览，仅参考）
      dynamic: adb + logcat（yoyo/runner/GameMaker tag） + And64InlineHook
      build: apktool 重打包 + smali patch（禁止物理删 SDK smali，RunnerJNILib JNI 依赖；禁止删 libyoyo.so
        引擎本体）
    android:
      static_primary: jadx
      static_backup: ''
      dynamic: Frida + And64InlineHook
      build: smali patch + apktool 重打包
    flutter:
      static_primary: Flutter 反编译（blutter / reFlutter / Dart SDK）
      static_backup: IDA（分析 libapp.so）
      dynamic: Frida + And64InlineHook
      build: apktool 重打包 + Dart patch
    unreal:
      static_primary: UE 资源提取工具（UE dumper / FModel）
      static_backup: IDA + Ghidra
      dynamic: Frida + And64InlineHook
      build: apktool 重打包 + native hook
    xamarin:
      static_primary: ILSpy / dnSpy（反编译 managed DLL）
      static_backup: ''
      dynamic: Frida + And64InlineHook
      build: apktool 重打包 + managed DLL 替换
