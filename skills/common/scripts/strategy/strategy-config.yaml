    air: 'SWF 文本替换走 22；嵌入字体处理走 air-20；SWF 反编译用 ffdec'
    il2cpp: '阶段重排为 01–29 线性连续：27 用户阶段 + sniff(01) + assess(02)。

      每个修改阶段紧跟独立真机验收（07/11/13/15/17/19/21/23/25，成功→强制固化）。

      强制阶段 21 个：01 02 03 04 05 06 07 08 09 10 11 12 14 16 18 20 22 24 26 28 29。

      旧 15 阶段已完整迁移到 01-18（无 legacy_stage_map，历史映射不再保留）。

      模板文件: skills/common/scripts/template-files/{MainActivity.template.java, JniBridge.template.java,
      SDKUtils.java}。

      所有新生成脚本必须固化到 skills/strategy/il2cpp-strategy-skill/scripts/{workflow,common}/。'
    unity-mono: '.NET DLL 反编译，il2cpp 的 predecessor；复用 android
      通用骨架 16-19 之外的所有阶段（[FLOWFIX 2026-08-16] 原 12-19 → 新 16-19）'
    cocos2dx: 'libMyGame.so 分析 + Lua 脚本提取走 cocos-05'
    cocos-creator: 'Cocos Creator 2.x/3.x（JS/TS）；cc-reverse
      自动检测版本、解密 XXTEA .jsc、提取场景/预制体/Spine 资源、还原为可读 TS/JS'
    libgdx: 'libGDX 引擎：lib/<abi>/libgdx.so + com/badlogic/gdx/**
      Java 框架 + AndroidApplication/Activity 入口；资源以 .atlas/.pack/.tmx/.fnt/.ttf/.ogg
      明文打包到 assets/，部分发行方做 hash 命名二次加密（通常是 Pangle 模板池，对游戏核心玩法无作用，可安全删除）。汉化通常走 Typeface
      TTF 替换路径（jadx 搜 createFromAsset 找字体文件名）。首个项目 JungleMarbleBlast 2026-08-06，com.cooyostudio.marble.blast。'
    defold: Defold 引擎：lib<game>.so 内含 libdmengine.so；assets game.{dmanifest,projectc,arcd,arci}；Java
      层 DefoldActivity + com.defold.*JNI glue；汉化走 lang pack（bk_lang_pack.zip 替换）；SDK
      移除用 manifest 清理策略（third-party-removal:sub-stage-defold-manifest-clean.py (third-party-removal-skill)）。首个项目
      BananaKong 2026-08-04。
    gamemaker: GameMaker Studio 引擎：libyoyo.so 内含 YYObjectBase/RValue/Java_com_yoyogames_runner_RunnerJNILib_*；assets/game.droid（FORM..GEN8
      magic）含 OPTN/LANG/EXTN/SOND/SPRT8/BGND/PATH/SCPT/GLOBX/SHDRX/FONT/TMLN/OBJTX/FEDS/ACRV/SEQN/TAGS/ROOMx/DAFL/EMBI/PSEM/PSYS/TPAG/TGIN8/CODE；Java
      层 RunnerActivity + RunnerJNILib glue；GML 编译进 CODE chunk 加密（不可静态 patch）；SDK 移除用
      manifest 清理策略（third-party-removal:sub-stage-defold-manifest-clean.py (third-party-removal-skill)
      可复用）。跳过 21/22（图片汉化走 .droid LANG chunk 而非 res/drawable）+ 23/24（GameMaker 内部字体渲染）+
      16/17（GML 编译加密，无法静态 patch UI）。[FLOWFIX 2026-08-16] 编号随激励/IAP 前移重排：原 07/08/13/14
      → 新 21/22/23/24/16/17。 首个项目 FindTheDifferences 2026-08-08。
