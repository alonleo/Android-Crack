# script: null 表示公共实现缺失；expected_script 仅记录预期位置，不参与路由。
# 公共阶段注册表：阶段名称映射到默认脚本路径。
# routing.py 优先读取 type register，未命中时查询本表。
# 主阶段和 helpers 的公共路径也在此注册。
# 编号与阶段元信息以 skills/common/scripts/strategy/sub-stages.yaml 为准。
# 路径声明不代表实现存在；调用前须检查目标脚本。

# 主阶段
major_stages:
  - id: M1
    name: sniff
    script: skills/common/general-strategy-skill/scripts/workflow/sub-stage-sniff.py
  - id: M2
    name: assess
    script: skills/common/general-strategy-skill/scripts/workflow/sub-stage-assess.py
  - id: M3
    name: final-check
    script: skills/common/general-strategy-skill/scripts/workflow/sub-stage-final-check.py
  - id: M4
    name: cleanup
    script: skills/common/general-strategy-skill/scripts/workflow/sub-stage-cleanup.py

# 子阶段（common 默认；type-specific 走各 skill 的 stages/sub-stage-register.yaml）
sub_stages:
